name: Windows game build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Run simulation tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Include CC0 photo textures in game bundle
        shell: pwsh
        run: |
          $dir = "build/Release/assets/textures"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $assets = @(
            @{ name = "concrete_wall_001.jpg"; source = "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/concrete_wall_001/concrete_wall_001_diff_1k.jpg" },
            @{ name = "concrete_floor_worn_001.jpg"; source = "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/concrete_floor_worn_001/concrete_floor_worn_001_diff_1k.jpg" },
            @{ name = "rusty_metal_02.jpg"; source = "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rusty_metal_02/rusty_metal_02_diff_1k.jpg" }
          )
          foreach ($asset in $assets) {
            try {
              $dest = Join-Path $dir $asset.name
              Invoke-WebRequest -Uri $asset.source -OutFile $dest -TimeoutSec 40 -ErrorAction Stop
              if ((Get-Item $dest).Length -lt 5000) { throw "File too small" }
              Write-Host "Bundled $($asset.name)"
            } catch {
              Write-Warning "Could not fetch $($asset.name): $($_.Exception.Message). Procedural fallback will be used."
            }
          }
      - name: Bundle authored-scale CC0 prison props
        shell: pwsh
        run: |
          $dir = "build/Release/assets/models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $props = @(
            @{ name = "cell_bunk.glb"; url = "https://cdn.3dassets.dev/assets/25595/v1/model.glb" },
            @{ name = "toilet_sink.glb"; url = "https://cdn.3dassets.dev/assets/25597/v1/model.glb" },
            @{ name = "cctv.glb"; url = "https://cdn.3dassets.dev/assets/25643/v1/model.glb" },
            @{ name = "control_desk.glb"; url = "https://cdn.3dassets.dev/assets/25646/v1/model.glb" },
            @{ name = "ceiling_fixture.glb"; url = "https://cdn.3dassets.dev/assets/25615/v1/model.glb" }
          )
          foreach ($prop in $props) {
            try {
              $destination = Join-Path $dir $prop.name
              Invoke-WebRequest -Uri $prop.url -OutFile $destination -TimeoutSec 45 -ErrorAction Stop
              if ((Get-Item $destination).Length -lt 10000) { throw "Invalid GLB download size" }
              Write-Host "Bundled model $($prop.name)"
            } catch {
              Write-Warning "Could not bundle $($prop.name): $($_.Exception.Message)"
            }
          }
      - name: Optional real-render smoke capture
        shell: pwsh
        continue-on-error: true
        run: |
          $env:AI_PRISON_PREVIEW = "1"
          $app = (Resolve-Path "build/Release/AIPrisonBreak.exe").Path
          $dir = (Resolve-Path "build/Release").Path
          $p = Start-Process -FilePath $app -WorkingDirectory $dir -PassThru
          if (-not $p.WaitForExit(25000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Graphics runner could not capture a live scene in 25 seconds."
          }
          if (-not (Test-Path "$dir/AIPrisonBreak-preview.png")) {
            Write-Warning "No screenshot produced; GitHub runner may not provide interactive graphics."
          }
      - name: Upload optional rendered screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIPrisonBreak-render-smoke
          path: build/Release/AIPrisonBreak-preview.png
          if-no-files-found: warn
      - name: Bundle CC0 life-scale police officer
        shell: pwsh
        run: |
          $modelPath = "build/Release/assets/models/officer.glb"
          $modelUrl = "https://files.innerscene.com/library/police-officer-standing-3d-person-emergency-services-9fd93114/5a54c44f2bfc5920ccd2/professional-police-officer.glb"
          try {
            Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath -TimeoutSec 90 -ErrorAction Stop
            if ((Get-Item $modelPath).Length -lt 1000000) { throw "Unusable GLB download" }
            Write-Host "Bundled full-scale CC0 police officer model"
          } catch {
            Remove-Item $modelPath -ErrorAction SilentlyContinue
            Write-Warning "Officer model unavailable: $($_.Exception.Message). Procedural fallback will remain."
          }
      - name: Upload native fullscreen Windows game
        uses: actions/upload-artifact@v4
        with:
          name: AIPrisonBreak-Windows-x64
          path: |
            build/Release/AIPrisonBreak.exe
            build/Release/assets/
          if-no-files-found: error
